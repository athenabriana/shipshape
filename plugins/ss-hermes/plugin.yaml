description: "Ship Shape for Hermes: one rigor mode (/ss:go) that matches a request to a playbook (investigate, bug-fix, review, ship, babysit, edge-cases) and sizes the process to the risk. One Bot per front, created and retired with ss:fronts; Bots never write code, the sessions they start do. Project facts live in AGENTS.md; builder, reviewer and scout are ephemeral subagents routed by model. Never merges."
