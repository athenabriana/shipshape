name: Validate

on:
  pull_request:
    paths:
      - "**/SKILL.md"
      - "plugins/**"
      - ".github/scripts/**"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Full history, so a step that diffs against the PR's base finds it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Validate frontmatter
        run: bun .github/scripts/validate-frontmatter.ts

      - name: Validate workflow scripts
        run: bun .github/scripts/validate-workflow-script.ts

      - name: Validate agent names
        run: bun .github/scripts/validate-agent-names.ts

      - name: Validate the trigger table
        run: bun .github/scripts/validate-triggers.ts

      - name: Validate the playbooks
        run: bun .github/scripts/validate-playbooks.ts

      - name: Validate skill size and named files
        run: bun .github/scripts/validate-skill-size.ts

      - name: Validator tests
        run: bun test .github/scripts

      - name: Unit tests
        run: python3 -m unittest discover -s plugins/ss/scripts -p 'test_*.py' -v

      - name: Hook unit tests
        run: python3 -m unittest discover -s plugins/ss/hooks -p 'test_*.py' -v

      - name: Companion plugin tests
        working-directory: plugins/companion
        run: bun install && bun test

      - name: Check formatting
        id: fmt
        run: bun run fmt:check

      # `--check` only names the files, so print the formatter's own diff: whoever
      # reads a red run gets the fix instead of a file list.
      - name: Show what the formatter would change
        if: failure() && steps.fmt.outcome == 'failure'
        run: |
          bun run fmt
          git --no-pager diff
